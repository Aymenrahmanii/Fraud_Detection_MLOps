<svg xmlns="http://www.w3.org/2000/svg" width="960" height="344" viewBox="0 0 960 344" role="img" aria-labelledby="title desc">
<title id="title">Closed loop: detect, diagnose, decide, approve, execute, verify, close</title>
<desc id="desc">Animated diagram. An incident flows through seven stages coordinated by the LangGraph orchestrator over Kafka. A human approves production changes, Agent 4 executes under a signed permit, Agent 1 verifies, and every step is appended to a hash-chained audit trail.</desc>
