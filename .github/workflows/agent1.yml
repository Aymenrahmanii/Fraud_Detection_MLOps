name: Agent 1 monitoring
on:
  pull_request:
    branches: [main]
    paths:
      - "agent1_monitoring/**"
      - "compose.agent1.yaml"
      - ".github/workflows/agent1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install Agent 1
        run: pip install -r agent1_monitoring/requirements.txt
      - name: Tests
        run: python -m pytest -q agent1_monitoring/tests
      - name: Static checks
        run: |
          ruff check agent1_monitoring
          mypy agent1_monitoring --exclude "tests|experiments" --ignore-missing-imports
