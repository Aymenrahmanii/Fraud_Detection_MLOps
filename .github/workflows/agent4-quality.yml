name: Agent 4 quality gate

on:
  push:
    branches: [Deployment-Agent]
    paths:
      - "agent4_deployment_recovery/**"
      - ".github/workflows/agent4-quality.yml"
  pull_request:
    branches: [Deployment-Agent]
    paths:
      - "agent4_deployment_recovery/**"
      - ".github/workflows/agent4-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Agent 4 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent4_deployment_recovery/requirements.txt ruff

      - name: Run Agent 4 tests
        run: python -m pytest agent4_deployment_recovery/tests -v

      - name: Run Ruff
        run: python -m ruff check agent4_deployment_recovery

      - name: Verify dependency consistency
        run: python -m pip check
