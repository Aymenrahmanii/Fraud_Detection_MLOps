name: Agent 4 quality gate

on:
  push:
    branches: [Deployment-Agent]
    paths:
      - "agent4_deployment_recovery/**"
      - ".github/workflows/agent4-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent4_deployment_recovery/**"
      - ".github/workflows/agent4-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Agent 4 test dependencies
        run: python -m pip install --require-hashes -r agent4_deployment_recovery/requirements-ci.txt

      - name: Run Agent 4 tests
        run: python -m pytest agent4_deployment_recovery/tests -v

      - name: Run Ruff
        run: python -m ruff check agent4_deployment_recovery

      - name: Verify dependency consistency
        run: python -m pip check
