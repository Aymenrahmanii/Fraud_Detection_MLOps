name: Agent 3 - Release Gate

on:
  pull_request:
    branches: [main, "agent3/**"]
  push:
    branches: [main, "agent3/**"]

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history to scan commits, not just the tip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Agent 3 tooling
        run: pip install --no-cache-dir -r agent3_security_quality/requirements.txt

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Install Trivy
        run: |
          curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            | tar -xz -C /usr/local/bin trivy

      - name: Build image for container scan
        run: docker build -t fraud-api:ci .

      - name: Run Agent 3 release assessment
        run: |
          python -m agent3_security_quality.cli assess \
            --image fraud-api:ci \
            --strict \
            --out release_assessment.json

      - name: Upload release assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-assessment
          path: release_assessment.json
