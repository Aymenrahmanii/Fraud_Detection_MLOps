name: Shared platform
on:
  pull_request:
    branches: [main]
    paths:
      - "aiops_platform/**"
      - "agent*/**"
      - "proto/**"
      - "docker/**"
      - "compose.platform.yaml"
      - ".github/workflows/platform.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v6
      - name: Install the platform and all six agents
        run: |
          grep -v -E '^(cachetools|cryptography|pywin32)==' agent6_mlops_lifecycle/constraints-tested.txt > /tmp/constraints.txt
          uv pip install --system -c /tmp/constraints.txt --override docker/overrides.txt \
            -r requirements.txt -r agent1_monitoring/requirements.txt -r agent2_diagnosis/requirements.txt \
            -r agent3_security_quality/requirements.txt -r docker/agent4-requirements.txt \
            -r agent5_resource_optimization/requirements.txt -r aiops_platform/requirements.txt
      - name: Generated gRPC code is up to date
        run: |
          python -m grpc_tools.protoc -Iproto --python_out=. --grpc_python_out=. proto/aiops_platform/rpc/gen/platform.proto
          git diff --exit-code aiops_platform/rpc/gen
      - name: Platform tests (contracts, bus, context, policy, HITL, gRPC, end-to-end loop)
        run: python -m pytest -q -W ignore aiops_platform/tests
      - name: Offline demo runs every v5 scenario
        run: python -W ignore -m aiops_platform.demo --auto
      - name: Reliability benchmark under injected faults (fails on any safety violation)
        run: python -W ignore -m aiops_platform.experiments.benchmark -n 10 --duplicates 0.3 --context-failures 0.05 --json benchmark.json
      - uses: actions/upload-artifact@v4
        with: {name: benchmark-report, path: benchmark.json}
      - name: Static checks
        run: ruff check aiops_platform --exclude aiops_platform/rpc/gen

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build the platform image
        run: docker compose -f compose.platform.yaml build sim-cluster
      - name: Distributed smoke test (Kafka + gRPC + Postgres + Redis)
        run: python3 aiops_platform/experiments/compose_smoke.py --start --stop
